# Release: QA gate -> build ZIP -> GitHub Release -> WordPress.org SVN.
#
#   1. Bump the version (plugin header, constant, core-class fallback, readme Stable tag + changelog).
#   2. Merge to main, then:  git tag v1.2.3 && git push origin v1.2.3
#
# Every step builds from the tagged commit; deploy only happens if all QA jobs pass.
name: Complete Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy-to-wporg:
        description: "Deploy to WordPress.org SVN"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: bizzio-sync-for-woocommerce

jobs:
  qa:
    name: QA
    uses: ./.github/workflows/ci.yml

  build:
    name: Build plugin ZIP
    needs: qa
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Resolve version
        id: version
        run: |
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; fi
          echo "version=$(php bin/check-versions.php "$tag")" >> "$GITHUB_OUTPUT"

      - name: Build ZIP (.distignore)
        run: |
          php bin/build-zip.php "$PLUGIN_SLUG" build
          unzip -l "build/$PLUGIN_SLUG.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/${{ env.PLUGIN_SLUG }}.zip
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_SLUG }}.zip
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bizzio Sync for WooCommerce v${{ needs.build.outputs.version }}
          body: |
            Built from `${{ github.sha }}` after PHPCS (WPCS), PHPStan, PHP 7.4–8.5 lint and Plugin Check passed.

            Changelog: see [readme.txt](https://github.com/${{ github.repository }}/blob/v${{ needs.build.outputs.version }}/${{ env.PLUGIN_SLUG }}/readme.txt).
          make_latest: true

  wporg-deploy:
    name: Deploy to WordPress.org
    needs: build
    if: github.event_name == 'push' || inputs.deploy-to-wporg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: wordpress.org
      url: https://wordpress.org/plugins/bizzio-sync-for-woocommerce/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      # Deploy exactly the QA-checked ZIP contents. With BUILD_DIR set the 10up action
      # rsyncs that folder as-is, so .distignore has already been applied by the build.
      - name: Extract build
        run: |
          mkdir -p build/dist
          unzip -q "$PLUGIN_SLUG.zip" -d build/dist

      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: ${{ env.PLUGIN_SLUG }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIR: build/dist/${{ env.PLUGIN_SLUG }}
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}

  summary:
    name: Summary
    needs: [qa, build, github-release, wporg-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## Release v${{ needs.build.outputs.version }}"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| QA | ${{ needs.qa.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| GitHub Release | ${{ needs.github-release.result }} |"
            echo "| WordPress.org | ${{ needs.wporg-deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
