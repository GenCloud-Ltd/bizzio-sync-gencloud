# Release: QA gate -> build ZIP -> GitHub Release -> WordPress.org SVN.
#
#   1. Bump the version (plugin header, constant, core-class fallback, readme Stable tag + changelog).
#   2. Merge to main, then:  git tag v1.2.3 && git push origin v1.2.3
#
# Every step builds from the tagged commit; deploy only happens if all QA jobs pass.
# QA is not run twice: when the QA workflow has already passed for the tagged commit
# (e.g. on the push to main after the merge), that run is the gate and the QA jobs are skipped.
name: Complete Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy-to-wporg:
        description: "Deploy to WordPress.org SVN"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_SLUG: bizzio-sync-for-woocommerce

jobs:
  qa-status:
    name: QA already passed?
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      run-url: ${{ steps.check.outputs.run-url }}
    steps:
      # Any successful run of ci.yml for this exact commit checked the same code. If the lookup
      # fails or finds nothing (e.g. QA on main is still running), QA runs here as before (fail closed).
      - name: Look for a successful QA run of ${{ github.sha }}
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty' 2>/dev/null || true)"
          # Only a real run URL counts; on an API error gh prints the error body instead.
          if [[ "$url" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[0-9]+$ ]]; then
            echo "QA already passed for ${GITHUB_SHA}: $url"
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "run-url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "No successful QA run for ${GITHUB_SHA}; QA will run in this pipeline."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  qa:
    name: QA
    needs: qa-status
    if: needs.qa-status.outputs.passed != 'true'
    # Upper bound for the called workflow; its Plugin Check job asks for pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Build plugin ZIP
    needs: [qa-status, qa]
    # Runs when QA passed here or was skipped because it already passed for this commit.
    if: ${{ !cancelled() && needs.qa-status.result == 'success' && (needs.qa.result == 'success' || needs.qa.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Resolve version
        id: version
        run: |
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; fi
          echo "version=$(php bin/check-versions.php "$tag")" >> "$GITHUB_OUTPUT"

      - name: Build ZIP (.distignore)
        run: |
          php bin/build-zip.php "$PLUGIN_SLUG" build
          unzip -l "build/$PLUGIN_SLUG.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/${{ env.PLUGIN_SLUG }}.zip
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-zip

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PLUGIN_SLUG }}.zip
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bizzio ERP Sync for WooCommerce v${{ needs.build.outputs.version }}
          body: |
            Built from `${{ github.sha }}` after PHPCS (WPCS), PHPStan, PHP 7.4–8.5 lint and Plugin Check passed.

            Changelog: see [readme.txt](https://github.com/${{ github.repository }}/blob/v${{ needs.build.outputs.version }}/${{ env.PLUGIN_SLUG }}/readme.txt).
          make_latest: true

  wporg-deploy:
    name: Deploy to WordPress.org
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || inputs.deploy-to-wporg == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: wordpress.org
      url: https://wordpress.org/plugins/bizzio-sync-for-woocommerce/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugin-zip

      # Deploy exactly the QA-checked ZIP contents. With BUILD_DIR set the 10up action
      # rsyncs that folder as-is, so .distignore has already been applied by the build.
      - name: Extract build
        run: |
          mkdir -p build/dist
          unzip -q "$PLUGIN_SLUG.zip" -d build/dist

      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: ${{ env.PLUGIN_SLUG }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIR: build/dist/${{ env.PLUGIN_SLUG }}
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}

  summary:
    name: Summary
    needs: [qa-status, qa, build, github-release, wporg-deploy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          {
            echo "## Release v${{ needs.build.outputs.version }}"
            echo "| Step | Result |"
            echo "|---|---|"
            if [ "${{ needs.qa-status.outputs.passed }}" = "true" ]; then
              echo "| QA | already passed: ${{ needs.qa-status.outputs.run-url }} |"
            else
              echo "| QA | ${{ needs.qa.result }} |"
            fi
            echo "| Build | ${{ needs.build.result }} |"
            echo "| GitHub Release | ${{ needs.github-release.result }} |"
            echo "| WordPress.org | ${{ needs.wporg-deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
